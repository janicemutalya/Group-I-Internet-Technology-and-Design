<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HTML5 demonstration contact form for Group I Professional Portfolio.">
    <title>Group I Professional Portfolio | Contact</title>
</head>
<body>
    <header>
        <h1>Group I Professional Portfolio</h1>
        <p>Contact page for our Internet Technologies and Web Design portfolio project.</p>
    </header>

    <nav aria-label="Main navigation">
    <a href="index.html">Home</a> |
    <a href="about.html">About</a> |
    <a href="gallery.html">Gallery</a> |
    <a href="data.html">Group Skills</a> |
    <a href="contact.html">Contact</a>
</nav>
    <hr>

    <main>
        <section>
            <h2>Send a Message</h2>
            <!-- Every form control has a label for accessibility. -->
            <form action="#" method="post">
                <p>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" required minlength="2" maxlength="60">
                </p>
                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="phone">Phone:</label><br>
                    <input type="tel" id="phone" name="phone" maxlength="20">
                </p>
                <p>
                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" rows="8" cols="50" required minlength="10" maxlength="500"></textarea>
                </p>
                <p>
                    <button type="submit">Send Message</button>
                    <button type="reset">Clear Form</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
    <hr>
    <p>&copy; 2026 Group I Professional Portfolio | Internet Technologies and Web Design.</p>
</footer>
</body>
</html>
